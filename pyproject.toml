[tool.poetry]
package-mode = false
name = "document-intelligence-platform"
version = "0.1.0"
description = "AI Document Intelligence Platform - Milestone 1"
authors = ["Lead Engineer <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
sqlmodel = "^0.0.38"
sqlalchemy = { version = "^2.0.51", extras = ["asyncio"] }
aiosqlite = "^0.18.0"
asyncpg = "^0.29.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0"
alembic = "^1.11.0"
pypdf = "^6.16.1"
pypdfium2 = "^5.13.0"
pytesseract = "^0.3.13"
pillow = "^12.3.0"
python-docx = "^1.2.0"
pgvector = "^0.4.1"
boto3 = "^1.40.0"
rq = "^2.6.0"
redis = "^6.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"
ruff = "^0.12.0"
mypy = "^1.5.1"
coverage = "^7.0.0"
pre-commit = "^4.4.0"

[tool.poetry.scripts]
# none yet

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
namespace_packages = false
files = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
