apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-intelligence-worker
  labels:
    app.kubernetes.io/name: document-intelligence
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: document-intelligence
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intelligence
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: document-intelligence-backend:latest
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "backend.app.worker"]
          envFrom:
            - configMapRef:
                name: document-intelligence-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: REDIS_URL
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 2Gi
