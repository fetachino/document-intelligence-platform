apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-intelligence-api
  labels:
    app.kubernetes.io/name: document-intelligence
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: document-intelligence
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intelligence
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: document-intelligence-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: document-intelligence-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: REDIS_URL
            - name: AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: AUTH_TOKEN_SECRET
            - name: BOOTSTRAP_TENANT_NAME
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: BOOTSTRAP_TENANT_NAME
                  optional: true
            - name: BOOTSTRAP_TENANT_SLUG
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: BOOTSTRAP_TENANT_SLUG
                  optional: true
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: BOOTSTRAP_ADMIN_EMAIL
                  optional: true
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: BOOTSTRAP_ADMIN_PASSWORD
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 1Gi
