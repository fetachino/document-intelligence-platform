apiVersion: batch/v1
kind: Job
metadata:
  name: document-intelligence-migrate
  labels:
    app.kubernetes.io/name: document-intelligence
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intelligence
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: document-intelligence-backend:latest
          imagePullPolicy: IfNotPresent
          args: ["alembic", "upgrade", "head"]
          env:
            - name: RUN_MIGRATIONS
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: document-intelligence-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 256Mi
