apiVersion: v1
kind: ConfigMap
metadata:
  name: document-intelligence-config
data:
  AUTH_TOKEN_TTL_MINUTES: "30"
  JOB_TRANSPORT: rq
  RQ_QUEUE_NAME: document-processing
  RQ_JOB_TIMEOUT_SECONDS: "900"
  STORAGE_BACKEND: s3
  S3_BUCKET_NAME: ""
  S3_REGION: ""
  S3_ENDPOINT_URL: ""
  S3_FORCE_PATH_STYLE: "false"
  MAX_UPLOAD_SIZE_BYTES: "20971520"
  RUN_MIGRATIONS: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-intelligence-frontend-config
data:
  API_UPSTREAM: http://document-intelligence-api:8000
