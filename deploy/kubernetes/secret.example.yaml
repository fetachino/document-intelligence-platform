apiVersion: v1
kind: Secret
metadata:
  name: document-intelligence-secrets
  namespace: document-intelligence
type: Opaque
stringData:
  DATABASE_URL: replace-with-an-external-postgresql-connection-url
  REDIS_URL: replace-with-an-external-redis-connection-url
  AUTH_TOKEN_SECRET: replace-with-at-least-32-random-characters
  BOOTSTRAP_TENANT_NAME: ""
  BOOTSTRAP_TENANT_SLUG: ""
  BOOTSTRAP_ADMIN_EMAIL: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
